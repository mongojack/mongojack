version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing new releases. Security updates are not delayed.
    cooldown:
      default-days: 7
    # Group build and test updates. Everything users receive gets its own pull request.
    groups:
      build-plugins:
        patterns:
          - "org.apache.maven*"
          - "org.apache.felix:*"
          - "org.jacoco:*"
          - "org.sonatype.central:*"
      test-dependencies:
        patterns:
          - "ch.qos.logback:*"
          - "org.assertj:*"
          - "org.junit*"
          - "org.testcontainers:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
